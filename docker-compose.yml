services:
  p9m:
    # The released image: it carries the templates, runtimes and the files p9m-init installs.
    # To work on the code, add docker-compose.dev.yml (COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml,
    # and COMPOSE_PATH_SEPARATOR=: on Windows, in .env).
    image: ghcr.io/csakaszamok/p9m:${P9M_VERSION:-0.18.7}
    ports:
      # Direct plain-HTTP API port (scripts, local dev): on this machine only. P9M_API_BIND=0.0.0.0 opens it
      # to every network, without TLS; everyone else goes through Traefik (PUBLIC_URL)
      - "${P9M_API_BIND:-127.0.0.1}:8081:3000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opt/sandboxes:/opt/sandboxes
      - ./opt/archive:/opt/archive
      - ./certs:/app/certs:ro
      - ./dynamic:/app/traefik-dynamic
    environment:
      # NOTE: Do NOT set TOKEN here — the base image's global TOKEN gate would block the UI and sign-in.
      # Per-route auth is handled by ADMIN_TOKEN in services/auth.ts instead.
      # No default: setup.sh writes a random one into .env
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is not set in .env - run ./setup.sh, it fills in a random one}
      DEFAULT_RUNTIME: ${DEFAULT_RUNTIME:-auto}
      # Runtimes new sandboxes may use (comma list); default sysbox. The privileged dind is for development only
      # (ALLOWED_RUNTIMES=sysbox,dind, or all): root in a dind sandbox can reach the host
      ALLOWED_RUNTIMES: ${ALLOWED_RUNTIMES:-sysbox}
      DEFAULT_TEMPLATE: ${DEFAULT_TEMPLATE:-starter}
      # off: never ask GitHub for the star and fork counts in the topbar
      GITHUB_STATS: ${GITHUB_STATS:-on}
      # off: no GitHub card in the topbar at all
      GITHUB_LINK: ${GITHUB_LINK:-on}
      # true: users can switch between the Simple and the Advanced view (otherwise they stay in Simple; the admin always can)
      USER_VIEW_SWITCH: ${USER_VIEW_SWITCH:-false}
      # The name and logo at the top left, on the sign-in page and in the tab titles: none hides them;
      # the logo can be an https:// address or an image file in the container (e.g. /app/data/logo.png)
      UI_TITLE: ${UI_TITLE:-Purgatorium Agentium}
      UI_LOGO: ${UI_LOGO:-}
      # off: the public sign-in page does not show the sandbox places (taken / free)
      LOGIN_CAPACITY: ${LOGIN_CAPACITY:-on}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-4g}
      SANDBOX_MAX_CPUS: ${SANDBOX_MAX_CPUS:-4}
      SANDBOX_MAX_MEMORY: ${SANDBOX_MAX_MEMORY:-8g}
      # How long a user's sandbox may stay awake idle / asleep before deep sleep, at most (empty: no limit)
      SANDBOX_MAX_IDLE_TIMEOUT: ${SANDBOX_MAX_IDLE_TIMEOUT:-}
      SANDBOX_MAX_DEEP_SLEEP_AFTER: ${SANDBOX_MAX_DEEP_SLEEP_AFTER:-}
      SANDBOX_DISK: ${SANDBOX_DISK:-20g}
      # Host folders the admin may mount into a sandbox (comma list, e.g. /srv/shared); empty: no mounts
      HOST_MOUNT_ROOTS: ${HOST_MOUNT_ROOTS:-}
      SANDBOX_MAX_TOTAL: ${SANDBOX_MAX_TOTAL:-200}
      HOST_ADDRESS: ${HOST_ADDRESS:-localhost}
      HOST_DOMAIN: ${HOST_DOMAIN:-lvh.me}
      # The sandboxes' apps, TCP and Docker addresses (empty: under HOST_DOMAIN too), e.g. p9m.app beside p9m.dev
      APPS_DOMAIN: ${APPS_DOMAIN:-}
      # Whether images that passed the secret scan can be pulled without a login
      REGISTRY_PUBLIC_PULL: ${REGISTRY_PUBLIC_PULL:-true}
      TRAEFIK_DYNAMIC_DIR: /app/traefik-dynamic
      API_TITLE: "Purgatorium API"
      # Host path of ./opt/sandboxes; override only if auto-detect fails (e.g. HOST_SANDBOXES_DIR=C:/m/docker/.../opt/sandboxes).
      HOST_SANDBOXES_DIR: ${HOST_SANDBOXES_DIR:-}
      # How often to look for sandboxes to put into deep sleep (e.g. 30s, 1m, 1h)
      DEEP_SLEEP_CHECK_INTERVAL: ${DEEP_SLEEP_CHECK_INTERVAL:-1m}
      # Max sandboxes per signed-in user (0 = unlimited); the admin is not limited
      SANDBOX_QUOTA: ${SANDBOX_QUOTA:-3}
      # UI sign-in. Admin: local account. Everyone else: OIDC (Google or any OpenID Connect provider).
      PUBLIC_URL: ${PUBLIC_URL:-http://${UI_HOST:-p9m.${HOST_DOMAIN:-lvh.me}}}
      UI_HOST: ${UI_HOST:-}
      # The users' own address: sign-in, /activate, /p9m:init; UI_HOST is then the admin's. Empty: sbx.<HOST_DOMAIN>; off: "off"
      USER_HOST: ${USER_HOST:-sbx.${HOST_DOMAIN:-lvh.me}}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Signed out after this long without doing anything in the web UI (e.g. 30m, 2h; off: never)
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # on: the admin can sign in with ADMIN_USER / ADMIN_PASSWORD (for emergencies; off: the form is not shown)
      ADMIN_LOGIN: ${ADMIN_LOGIN:-off}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Google}
      # Who may sign in with OIDC (comma lists). With OIDC on, one of them is needed, or OIDC_ALLOW_ANYONE=true
      # (anyone with an account at the provider): otherwise Purgatorium refuses to start
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      OIDC_ALLOW_ANYONE: ${OIDC_ALLOW_ANYONE:-false}
      OIDC_ADMIN_EMAILS: ${OIDC_ADMIN_EMAILS:-}
      # App access (docs: app-access.md): who opens an app without p9m.access; the key of its cookies and tickets
      APPS_ACCESS_DEFAULT: ${APPS_ACCESS_DEFAULT:-owner}
      APP_ACCESS_SECRET: ${APP_ACCESS_SECRET:-}
      # The Hub (docs: hub.md): off unless true; viewers besides the builders by domain or address
      HUB_ENABLED: ${HUB_ENABLED:-false}
      HUB_HOST: ${HUB_HOST:-}
      HUB_ALLOWED_DOMAINS: ${HUB_ALLOWED_DOMAINS:-}
      HUB_ALLOWED_EMAILS: ${HUB_ALLOWED_EMAILS:-}
      HUB_TITLE: ${HUB_TITLE:-Hub}
    networks:
      default:
      traefik-net:
      # Internal (no sandbox on it): Sablier's /metrics (session expiry per sandbox), and Traefik asks Purgatorium's
      # internal port here (app access, the 404 page), which listens on this network only
      sablier-net:
        aliases: [p9m-internal]
    # A name that does not resolve (a sandbox just removed or asleep) waits for the host's resolver: 5 s by default,
    # holding up Purgatorium's other lookups meanwhile. Give up after 1 s, once more
    dns_opt:
      - timeout:1
      - attempts:2
    labels:
      traefik.enable: "true"
      # The UI, and the users' address (USER_HOST, sbx.<HOST_DOMAIN> when empty)
      traefik.http.routers.p9m.rule: "Host(`${UI_HOST:-p9m.${HOST_DOMAIN:-lvh.me}}`) || Host(`${USER_HOST:-sbx.${HOST_DOMAIN:-lvh.me}}`)"
      traefik.http.routers.p9m.entrypoints: web,websecure
      traefik.http.routers.p9m.service: p9m
      traefik.http.services.p9m.loadbalancer.server.port: "3000"
      # The Hub's own host (HUB_ENABLED=true), served by Purgatorium; 404 while the Hub is off
      traefik.http.routers.p9m-hub.rule: "Host(`${HUB_HOST:-hub.${HOST_DOMAIN:-lvh.me}}`)"
      traefik.http.routers.p9m-hub.entrypoints: web,websecure
      traefik.http.routers.p9m-hub.service: p9m
      # TLS-only TCP addresses for sandbox ports (<http-name>-tcp.<apps domain>:443) and sandbox Docker APIs
      # (<raw>-docker.<apps domain>:443), passed through to the TCP gateway
      traefik.tcp.routers.p9m-tcp.rule: "HostSNIRegexp(`^[a-z0-9-]+-(tcp|docker)[.]${APPS_DOMAIN:-${HOST_DOMAIN:-lvh.me}}$$`)"
      traefik.tcp.routers.p9m-tcp.entrypoints: websecure
      traefik.tcp.routers.p9m-tcp.tls.passthrough: "true"
      traefik.tcp.routers.p9m-tcp.service: p9m-tcp
      traefik.tcp.services.p9m-tcp.loadbalancer.server.port: "4443"
      traefik.docker.network: traefik-net
      # Catch-all (lowest priority): hosts without a sandbox router — deep-sleeping
      # or unknown sandboxes — go to /wake, which rebuilds or 404s.
      traefik.http.routers.p9m-wake.rule: "HostRegexp(`.+`)"
      traefik.http.routers.p9m-wake.priority: "1"
      traefik.http.routers.p9m-wake.entrypoints: web,websecure
      traefik.http.routers.p9m-wake.middlewares: "wake-path@docker"
      traefik.http.routers.p9m-wake.service: p9m
      traefik.http.middlewares.wake-path.replacepath.path: "/wake"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/registry-auth.crt && test -f /app/data/registry-notify.secret"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  # One-shot, on every up: copies this release's Sablier themes, registry config and
  # dynamic/errors.yml from the image, so they always match it (no files from a checkout).
  p9m-init:
    image: ghcr.io/csakaszamok/p9m:${P9M_VERSION:-0.18.7}
    entrypoint: ["sh", "/app/assets/install-assets.sh"]
    volumes:
      - sablier_themes:/out/sablier-themes
      - registry_conf:/out/registry
      - ./dynamic:/out/dynamic
    network_mode: none
    restart: "no"

  registry:
    image: registry:2.8.3
    environment:
      REGISTRY_AUTH: token
      # Where docker clients get registry tokens: p9m via PUBLIC_URL when set (https in a public deployment)
      REGISTRY_AUTH_TOKEN_REALM: "${PUBLIC_URL:-http://${HOST_ADDRESS:-localhost}:8081}/v2/auth"
      REGISTRY_AUTH_TOKEN_SERVICE: "registry.${HOST_DOMAIN:-lvh.me}"
      REGISTRY_AUTH_TOKEN_ISSUER: p9m
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /auth/registry-auth.crt
      REGISTRY_HTTP_SECRET: "${REGISTRY_HTTP_SECRET:-changeme}"
    # config.yml (from the image, via p9m-init) adds push notifications (to Purgatorium, for secret scanning) and deletes
    entrypoint: ["/bin/sh", "-c", "sed \"s|__NOTIFY_SECRET__|$$(cat /auth/registry-notify.secret)|\" /etc/p9m/config.yml > /etc/docker/registry/config.yml && exec registry serve /etc/docker/registry/config.yml"]
    volumes:
      - registry_data:/var/lib/registry
      - registry_conf:/etc/p9m:ro
      - ./data:/auth:ro
    networks:
      - traefik-net
    labels:
      traefik.enable: "true"
      traefik.http.routers.registry.rule: "Host(`registry.${HOST_DOMAIN:-lvh.me}`)"
      traefik.http.routers.registry.entrypoints: web,websecure
      traefik.http.services.registry.loadbalancer.server.port: 5000
      traefik.docker.network: traefik-net
    restart: unless-stopped
    depends_on:
      p9m:
        condition: service_healthy
      p9m-init:
        condition: service_completed_successfully
        restart: true

  traefik:
    image: traefik:v3.6.25
    command:
      - --experimental.plugins.sablier.moduleName=github.com/sablierapp/sablier-traefik-plugin
      - --experimental.plugins.sablier.version=v1.3.0
      - --providers.docker=true
      # A new sandbox's router within half a second of its socat turning healthy (the default waits 2 s)
      - --providers.providersThrottleDuration=500ms
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=traefik-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true

      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # The app access middleware of every sandbox (p9m.access), from Purgatorium every 2 s
      - "--providers.http.endpoint=http://p9m-internal:3001/traefik/access"
      - "--providers.http.pollInterval=2s"
      - "--entrypoints.web.http.middlewares=global-error-pages@file"
      - "--entrypoints.websecure.http.middlewares=global-error-pages@file"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks:
      traefik-net:
        aliases:
          # Sandboxes reach the registry and its token endpoint through Traefik by name (not 127.0.0.1)
          - registry.${HOST_DOMAIN:-lvh.me}
          - ${UI_HOST:-p9m.${HOST_DOMAIN:-lvh.me}}
          - ${USER_HOST:-sbx.${HOST_DOMAIN:-lvh.me}}
      sablier-net: {}
    restart: unless-stopped
    # Its error-page middleware is in dynamic/errors.yml, which p9m-init writes; restarted when a new release
    # recreates p9m-init.
    depends_on:
      p9m-init:
        condition: service_completed_successfully
        restart: true

  sablier:
    image: sablierapp/sablier:1.18.0
    command:
      - start
      - --provider.name=docker
      # Persist sessions so restarting Sablier does not put running sandboxes to sleep
      # (auto-stop-on-startup stops every instance it has no session for).
      - --storage.file=/data/state.json
      # Read-only /metrics: p9m shows each sandbox's session expiry (time until sleep).
      - --server.metrics.enabled
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sablier_themes:/etc/sablier/themes:ro
      - sablier_data:/data
    # Themes are read at start: a new release's p9m-init run restarts it
    depends_on:
      p9m-init:
        condition: service_completed_successfully
        restart: true
    # Only Traefik talks to Sablier; keep it off traefik-net so sandboxes cannot reach its API.
    networks:
      - sablier-net
    restart: unless-stopped

  registry-cache:
    image: registry:3.1.2
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      # How long a downloaded image stays, counted from its first download (using it does not extend it); 0 = for ever
      REGISTRY_PROXY_TTL: ${REGISTRY_CACHE_TTL:-720h}
    volumes:
      - registry_cache_data:/var/lib/registry
    networks:
      traefik-net:
        # The sandboxes reach it through their own socat, which goes here by this name
        aliases: [p9m-registry-cache]

  # The same for ghcr.io (Purgatorium's own images: the claude container /p9m:teleport starts, the claude-code
  # templates): dockerd uses a mirror only for Docker Hub, so these are pulled as registry-cache:5001/<path>
  registry-cache-ghcr:
    image: registry:3.1.2
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
      REGISTRY_PROXY_TTL: ${REGISTRY_CACHE_TTL:-720h}
    volumes:
      - registry_cache_ghcr_data:/var/lib/registry
    networks:
      traefik-net:
        aliases: [p9m-registry-cache-ghcr]

volumes:
  registry_data:
  sablier_data:
  registry_cache_data:
  registry_cache_ghcr_data:
  sablier_themes:
  registry_conf:

networks:
  traefik-net:
    name: traefik-net
  sablier-net:
    name: sablier-net
    internal: true
