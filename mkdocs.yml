# The documentation site: MkDocs Material, one version per release series (mike), published to GitHub Pages
# by .github/workflows/docs.yml. Locally: pip install -r docs/requirements.txt && mkdocs serve
site_name: Purgatorium (p9m)
site_description: Self-hosted sandboxes for your team and their AI agents
site_url: https://csakaszamok.github.io/p9m/
repo_url: https://github.com/csakaszamok/p9m
repo_name: csakaszamok/p9m
edit_uri: ""
copyright: AGPL-3.0 · Based on Purgatorium (p9m)

exclude_docs: |
  superpowers/
  requirements.txt

theme:
  name: material
  logo: media/logo.svg
  favicon: media/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle: { icon: material/brightness-4, name: Light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle: { icon: material/brightness-7, name: Dark mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - media/extra.css

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - First sandbox: first-sandbox.md
      - Configuration: configuration.md
      - HTTPS: https.md
  - Tutorials:
      - tutorials/index.md
      - With Claude Code: tutorials/claude-code.md
      - Claude Code on one page: tutorials/claude-code-cheatsheet.md
      - With any agent: tutorials/other-agents.md
      - Share on the Hub: tutorials/hub.md
  - Using Purgatorium:
      - Web UI and sign-in: web-ui.md
      - Runtimes and templates: runtimes-templates.md
      - Sleep and wake: sleep-wake.md
      - CPU, memory and disk: resources.md
      - Deep sleep: deep-sleep.md
      - Delete = archive: archive.md
      - Isolation and TCP addresses: networking.md
      - SSH, terminal and logs: shell-and-logs.md
      - Files: files.md
      - Hub: hub.md
      - App access: app-access.md
  - Agents:
      - Let your agent deploy: agents.md
      - MCP: mcp.md
      - Claude Code plugin: claude-plugin.md
      - Agent guide: agent-guide.md
  - Reference:
      - API: api.md
      - Security: security.md
      - Upgrading: upgrading.md
      - Comparison: comparison.md
      - Roadmap: roadmap.md
      - Architecture: architecture.html

plugins:
  - search
  - llmstxt:
      # The version's own address (https://…/p9m/0.4/): docs.yml sets it for each version it publishes
      base_url: !ENV [LLMSTXT_BASE_URL, 'https://csakaszamok.github.io/p9m/latest/']
      markdown_description: >-
        Purgatorium (p9m) gives each user of a team their own Docker daemon on demand: a sandbox with Portainer,
        a public URL for every app, sleep when idle and wake on the next request, archive on delete.
        A REST API and an MCP server (at /mcp) let coding agents create, wake and deploy to sandboxes.
      full_output: llms-full.txt
      sections:
        Getting started:
          - install.md
          - first-sandbox.md
          - configuration.md
          - https.md
        Tutorials:
          - tutorials/index.md
          - tutorials/claude-code.md
          - tutorials/claude-code-cheatsheet.md
          - tutorials/other-agents.md
          - tutorials/hub.md
        Using Purgatorium:
          - web-ui.md
          - runtimes-templates.md
          - sleep-wake.md
          - resources.md
          - deep-sleep.md
          - archive.md
          - networking.md
          - shell-and-logs.md
          - files.md
          - hub.md
          - app-access.md
        Agents:
          - agents.md
          - mcp.md
          - claude-plugin.md
          - agent-guide.md
        Reference:
          - api.md
          - security.md
          - upgrading.md
          - comparison.md
