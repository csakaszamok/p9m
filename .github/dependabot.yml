# Weekly update PRs. They go to the newest series' branch (CONTRIBUTING.md: Branches and releases), not to main:
# move target-branch with it when a new release/x.y starts. Security-update PRs (repo settings) always go to main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: release/0.21
    schedule: { interval: weekly }
    groups:
      # One PR for the minor and patch updates; majors one by one
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # js-yaml 5 is a rewrite: no default export, YAML 1.2 core schema by default (no `<<` merge keys), which
      # changes how compose files read. 4.x still gets its fixes
      - dependency-name: js-yaml
        update-types: [version-update:semver-major]
      # The types follow the Node that CI and the image run (22)
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/0.21
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    target-branch: release/0.21
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /docs
    target-branch: release/0.21
    schedule: { interval: monthly }
