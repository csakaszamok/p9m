name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.latest.outputs.is_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A fix for an older series (v0.3.2 after v0.4.0) must not become `latest`
      - id: latest
        run: |
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then echo "is_latest=true" >> "$GITHUB_OUTPUT"; else echo "is_latest=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Before anything is pushed: the compose file attached to the release must run this tag's image
      - run: bash scripts/check-release-version.sh "${{ github.ref_name }}"

      # Docker Hub's pull limit for anonymous pulls is shared by GitHub's runners (429 on the base image);
      # logged in it is far higher. Skipped without the secret (e.g. a pull request from a fork).
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.1.0 → 0.1.0, 0.1 and (the highest version only) latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.latest.outputs.is_latest }}
        run: |
          version=${TAG#v}
          # The section of CHANGELOG.md for this version, without its heading
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          # The install files of this release: the compose file, the scripts, and env.example (no leading dot in an asset name)
          mkdir dist
          cp docker-compose.yml check-host.sh dist/
          cp .env.example dist/env.example
          sed "s/^P9M_RELEASE=.*/P9M_RELEASE=$TAG/" setup.sh > dist/setup.sh
          grep -q "^P9M_RELEASE=$TAG\$" dist/setup.sh
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest="$LATEST" dist/*

      - name: The release has its install files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in check-host.sh docker-compose.yml setup.sh env.example; do
            echo "$assets" | grep -qx "$f" || { echo "missing release asset: $f"; exit 1; }
          done

  # The newest version on the MCP Registry, as io.github.p9m-team/p9m: the name belongs to the p9m-team GitHub user,
  # which the repository's OIDC token cannot prove, so it signs in with that user's token (a classic PAT, no scopes),
  # kept as the secret MCP_REGISTRY_TOKEN. Only for the highest version (an older series' fix does not go back in time).
  mcp-registry:
    needs: image
    if: needs.image.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Sign in as p9m-team
        env:
          MCP_REGISTRY_TOKEN: ${{ secrets.MCP_REGISTRY_TOKEN }}
        run: |
          if [ -z "$MCP_REGISTRY_TOKEN" ]; then
            echo "::error::The secret MCP_REGISTRY_TOKEN (a token of the p9m-team user) is not set"
            exit 1
          fi
          ./mcp-publisher login github --token "$MCP_REGISTRY_TOKEN"
      - run: ./mcp-publisher publish
