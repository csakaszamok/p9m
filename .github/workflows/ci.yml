name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

env:
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Also as a file: a test that fails only now and then is named, with its error, in the artifact
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results/

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash -n setup.sh check-host.sh scripts/install-assets.sh
      - run: bash tests/install-assets.sh
      - run: bash tests/setup.sh
      - run: bash -n plugins/p9m/scripts/*.sh
      - run: bash tests/teleport-lib.sh
      - run: bash tests/teleport-in.sh
      - run: bash tests/teleport.sh

  install:
    # A fresh install from the release files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker Hub's pull limit for anonymous pulls is shared by GitHub's runners (429 on the base image);
      # logged in it is far higher. Skipped without the secret (e.g. a pull request from a fork).
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: bash tests/install.sh

  image:
    # The image must still build; it is only pushed on a release tag (release.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker Hub's pull limit for anonymous pulls is shared by GitHub's runners (429 on the base image);
      # logged in it is far higher. Skipped without the secret (e.g. a pull request from a fork).
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The claude-code-minimal template's image too
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/claude-code-minimal
          push: false
      # and the claude-code-ecc one (on the published minimal image)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/claude-code-ecc
          push: false
