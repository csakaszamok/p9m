name: Sysbox

# The sysbox runtime end to end on a Linux host: installs sysbox on the runner, starts the stack with
# DEFAULT_RUNTIME=sysbox and runs a new sandbox, the sleep/wake and the archive scripts against it. A few minutes, but
# on every pull request: a new sandbox that never started (0.16-0.18) passed every unit test.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'release/**']

env:
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
  SYSBOX_VERSION: 0.6.7
  P9M_TOKEN: abc123

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Docker Hub's pull limit for anonymous pulls is shared by GitHub's runners (429 on the base image);
      # logged in it is far higher. Skipped without the secret (e.g. a pull request from a fork).
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install sysbox
        run: |
          deb="sysbox-ce_${SYSBOX_VERSION}-0.linux_amd64.deb"
          wget -q "https://downloads.nestybox.com/sysbox/releases/v${SYSBOX_VERSION}/$deb"
          # The installer restarts dockerd and refuses to while containers run
          docker rm -f $(docker ps -aq) 2>/dev/null || true
          sudo apt-get update -q
          sudo apt-get install -y -q jq "./$deb"
          docker info --format '{{json .Runtimes}}' | jq -e 'has("sysbox-runc")'

      - name: Start the stack (DEFAULT_RUNTIME=sysbox)
        run: |
          cat > .env <<EOF
          ADMIN_TOKEN=$P9M_TOKEN
          DEFAULT_RUNTIME=sysbox
          HOST_ADDRESS=localhost
          SESSION_SECRET=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          ADMIN_PASSWORD=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
          # The scripts open the hello app without signing in (the default is owner since 0.12.12: a sign-in redirect)
          APPS_ACCESS_DEFAULT=public
          # The image from this checkout (p9m and p9m-init), not the released one: the release compose file has no build.
          # Its hostname not its ID, as a server had: Purgatorium must find its own container anyway
          COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml:tests/compose/hostname-not-id.yml
          EOF
          docker compose build
          docker compose up -d --wait

      - name: A sandbox runs on sysbox-runc, not privileged
        run: |
          name="sb$(head -c 3 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          full=$(curl -sf -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $P9M_TOKEN" \
            -d "{\"name\":\"$name\"}" http://localhost:8081/sandboxes | jq -r .name)
          trap 'curl -sf -X DELETE -H "Authorization: Bearer $P9M_TOKEN" "http://localhost:8081/sandboxes/$full" >/dev/null || true' EXIT
          docker inspect -f 'runtime={{.HostConfig.Runtime}} privileged={{.HostConfig.Privileged}}' "$full"
          [ "$(docker inspect -f '{{.HostConfig.Runtime}}' "$full")" = sysbox-runc ]
          [ "$(docker inspect -f '{{.HostConfig.Privileged}}' "$full")" = false ]
          for i in $(seq 1 60); do
            curl -s -m 5 -H "Host: $name-inner-http-echo-port5678.lvh.me" http://localhost/ | grep -q hello && exit 0
            sleep 3
          done
          echo "the app inside the sandbox never answered"; exit 1

      - name: tests/new-sandbox.sh (made as the UI makes it; running in the list and its details, not restarting)
        run: bash tests/new-sandbox.sh

      - name: tests/sablier-wake.sh
        run: bash tests/sablier-wake.sh

      - name: tests/archive.sh
        # The archive under opt/ is written by root (Purgatorium runs in a container)
        run: sudo -E bash tests/archive.sh

      - name: Logs
        if: failure()
        run: |
          docker compose logs --no-color --tail=200
          for c in $(docker ps -a --filter label=p9m.managed=true --format '{{.Names}}'); do
            echo "=== $c"; docker logs --tail=100 "$c" 2>&1
          done
          sudo journalctl -u sysbox-mgr -u sysbox-fs --no-pager | tail -100
