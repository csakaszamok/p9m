name: Bug report
description: Something does not work as the documentation says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a sandbox with ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Purgatorium version or commit
      placeholder: v0.6.4 (shown in the top bar), or the output of git rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      description: OS, Docker version, and the sandbox's runtime (sysbox, kata or dind) and template
      placeholder: Ubuntu 24.04, Docker 29.8, sysbox, starter
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `docker compose logs p9m` (and of the sandbox, `docker logs p9m-<name>`). Remove secrets and tokens.
      render: text
