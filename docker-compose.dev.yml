# Development: run Purgatorium from this checkout instead of the released image's code and files.
# Enable with COMPOSE_PATH_SEPARATOR=: and COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml in .env;
# code, template, runtime and error page edits apply on the next request; errors.yml on the next `docker compose up -d`;
# Sablier themes and the registry config also need `docker compose restart sablier registry` (they read them at start).
services:
  p9m:
    build: .
    environment:
      # Development: dind too (Docker Desktop has no sysbox, and no KVM for kata); a server keeps the default, sysbox only
      ALLOWED_RUNTIMES: ${ALLOWED_RUNTIMES:-all}
    volumes:
      - ./server.ts:/app/server.ts
      - ./routes:/app/routes
      - ./services:/app/services
      - ./ui:/app/ui
      - ./templates:/app/templates
      - ./runtimes:/app/runtimes
      - ./error-pages:/app/error-pages:ro
      - ./package.json:/app/p9m/package.json:ro
  p9m-init:
    build: .
    volumes:
      - ./sablier-themes:/app/assets/sablier-themes:ro
      - ./sablier-plugin:/app/assets/sablier-plugin:ro
      - ./registry:/app/assets/registry:ro
      - ./traefik:/app/assets/traefik:ro
      - ./scripts/install-assets.sh:/app/assets/install-assets.sh:ro
